    <h1>New event</h1>
    <div class="muted" style="margin-bottom:18px">Students will see it under Events and can register until the event day.</div>

    <form method="post" action="../events.html"><input type="hidden" name="_csrf" value="qcsxABKDU0turEUXqCahdvecMWfhNYXdWJ8chBSNmsGL9JjvmPkHOCC2NXxDyHR0yguVR8H6HAWCB7bwYKcusXXvoqW-wqvb"/>
        <div class="form-grid">
            <div style="grid-column:1/-1"><label>Title</label><input name="title" required maxlength="200"></div>
            <div>
                <label>Category</label>
                <select name="category">
                    <option value="TECHNICAL">Technical</option>
                    <option value="WORKSHOP">Workshop</option>
                    <option value="SEMINAR">Seminar</option>
                    <option value="CULTURAL">Cultural</option>
                    <option value="SPORTS">Sports</option>
                </select>
            </div>
            <div><label>Venue</label><input name="venue" required placeholder="e.g. Seminar Hall"></div>
            <div><label>Date</label><input type="date" name="date" min="2026-11-19" required></div>
            <div><label>Start time</label><input type="time" name="startTime"></div>
            <div><label>Seats (0 = no limit)</label><input type="number" name="capacity" min="0" value="0"></div>
            <div style="grid-column:1/-1"><label>Description</label><textarea name="description" rows="4" maxlength="2000"></textarea></div>
        </div>
        <div class="form-actions">
            <button class="primary" type="submit">Create event</button>
            <a class="btn" href="../events.html">Cancel</a>
        </div>
    </form>
</main>
