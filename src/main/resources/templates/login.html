<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<div class="login-box">
    <h1>GM University</h1>
    <div class="muted">ERP · Sign in</div>

    <div class="flash error" style="margin-top:16px" th:if="${param.error}">Wrong username or password</div>
    <div class="flash" style="margin-top:16px" th:if="${param.logout}">You have been logged out</div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Username (USN / Employee ID)</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="remember">
            <input id="remember-me" name="remember-me" type="checkbox">
            <label for="remember-me">Remember me</label>
        </div>
        <div class="form-actions">
            <button class="primary" type="submit" style="width:100%">Sign in</button>
        </div>
    </form>

    <div class="demo">
        Demo logins<br>
        Admin: <b>admin</b> / admin123<br>
        Faculty: <b>F001</b> / faculty123<br>
        Student: <b>U25CS001</b> / student123
    </div>
</div>
</body>
</html>
