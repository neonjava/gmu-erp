<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · GMU ERP'">GMU ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>

<header th:fragment="header" class="topbar">
    <a class="brand" th:href="@{/}"><span class="logo">G</span><span>GMU <b>ERP</b></span></a>
    <nav class="nav">
        <a th:href="@{/}">Home</a>
        <th:block sec:authorize="hasRole('STUDENT')">
            <a th:href="@{/student/attendance}">Attendance</a>
            <a th:href="@{/student/timetable}">Time Table</a>
            <a th:href="@{/student/results}">Results</a>
            <a th:href="@{/student/registration}">Registration</a>
        </th:block>
        <th:block sec:authorize="hasRole('FACULTY')">
            <a th:href="@{/faculty/courses}">My Courses</a>
            <a th:href="@{/faculty/timetable}">My Time Table</a>
        </th:block>
        <th:block sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/students}">Students</a>
            <a th:href="@{/admin/faculty}">Faculty</a>
            <a th:href="@{/admin/courses}">Courses</a>
            <a th:href="@{/admin/timetable}">Time Table</a>
            <a th:href="@{/admin/notices}">Notices</a>
        </th:block>
    </nav>
    <div class="who" th:if="${me != null}">
        <a th:href="@{/profile}" th:text="${me.displayName}">Name</a>
        <form th:action="@{/logout}" method="post"><button class="small" type="submit">Log out</button></form>
    </div>
</header>

<div th:fragment="flash">
    <div class="flash" th:if="${success}" th:text="${success}"></div>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>
