<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${title} + ' · GMU ERP'">GMU ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>

<!-- The island: a floating bar. Inactive tabs show an icon; the current tab opens to show its name. -->
<header th:fragment="header" class="topbar">
    <svg class="sprite" aria-hidden="true">
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.2 12.2 2.6 2.6 5-5.3"/></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-7M10 20V5M15 20v-9M20 20V9"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></symbol>
        <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 14 9.6l6 2.4-6 2.4-2 6.1-2-6.1-6-2.4 6-2.4z"/></symbol>
        <symbol id="i-box" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5 12 11.5l8.5-4M12 11.5v9"/></symbol>
        <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M15.5 5a3.5 3.5 0 0 1 0 7M17.5 14.2A6.2 6.2 0 0 1 21.2 20"/></symbol>
        <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 21h4"/></symbol>
        <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 20 4c-.5 10-5.5 15-14 15z"/><path d="M5 19c3-4 6-7 10-9"/></symbol>
        <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h4.5a1.5 1.5 0 0 1 1.5 1.5v13a1.5 1.5 0 0 1-1.5 1.5H14M10 8l-4 4 4 4M6 12h10"/></symbol>
    </svg>

    <a class="brand" th:href="@{/}" title="GMU ERP home"><img class="logo" th:src="@{/img/gmu-logo.png}" alt="GM University" width="40" height="40"><span class="brand-name">GMU ERP</span></a>

    <nav class="nav" aria-label="Main">
        <a th:href="@{/}"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
        <th:block sec:authorize="hasRole('STUDENT')">
            <a th:href="@{/student/attendance}"><svg class="ic"><use href="#i-check"/></svg><span>Attendance</span></a>
            <a th:href="@{/student/timetable}"><svg class="ic"><use href="#i-calendar"/></svg><span>Time table</span></a>
            <a th:href="@{/student/results}"><svg class="ic"><use href="#i-chart"/></svg><span>Results</span></a>
            <a th:href="@{/student/registration}"><svg class="ic"><use href="#i-book"/></svg><span>Registration</span></a>
        </th:block>
        <th:block sec:authorize="hasRole('FACULTY')">
            <a th:href="@{/faculty/courses}"><svg class="ic"><use href="#i-book"/></svg><span>My courses</span></a>
            <a th:href="@{/faculty/timetable}"><svg class="ic"><use href="#i-calendar"/></svg><span>Time table</span></a>
        </th:block>
        <th:block sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/students}"><svg class="ic"><use href="#i-users"/></svg><span>Students</span></a>
            <a th:href="@{/admin/faculty}"><svg class="ic"><use href="#i-person"/></svg><span>Faculty</span></a>
            <a th:href="@{/admin/courses}"><svg class="ic"><use href="#i-book"/></svg><span>Courses</span></a>
            <a th:href="@{/admin/timetable}"><svg class="ic"><use href="#i-calendar"/></svg><span>Time table</span></a>
            <a th:href="@{/admin/notices}"><svg class="ic"><use href="#i-bell"/></svg><span>Notices</span></a>
        </th:block>
        <th:block th:if="${me != null}">
            <a th:href="@{/events}"><svg class="ic"><use href="#i-spark"/></svg><span>Events</span></a>
            <a th:href="@{/resources}"><svg class="ic"><use href="#i-box"/></svg><span>Resources</span></a>
        </th:block>
    </nav>

    <div class="clock" aria-hidden="true"><i class="ring"></i><span class="clock-date"></span><b class="clock-time"></b></div>

    <div class="who" th:if="${me != null}">
        <button class="icon-btn leaf-btn" type="button" data-leaf-toggle title="Falling leaves on or off" aria-label="Falling leaves" aria-pressed="true" hidden><svg class="ic"><use href="#i-leaf"/></svg></button>
        <a class="avatar" th:href="@{/profile}" th:title="${me.displayName} + ' (profile)'"
           th:text="${#strings.substring(me.displayName, 0, 1)}">H</a>
        <form th:action="@{/logout}" method="post">
            <button class="icon-btn" type="submit" title="Log out" aria-label="Log out"><svg class="ic"><use href="#i-out"/></svg></button>
        </form>
    </div>
</header>

<div th:fragment="flash" class="toasts">
    <div class="flash" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="flash error" role="alert" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>
