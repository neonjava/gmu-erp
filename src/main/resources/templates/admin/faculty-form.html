<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${f.id == null ? 'Add faculty' : 'Edit faculty'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 th:text="${f.id == null ? 'Add faculty' : 'Edit ' + f.empId}"></h1>
    <p class="muted small" th:if="${f.id == null}">A login is created automatically: username = Employee ID, password = faculty123.</p>

    <form method="post" th:action="@{/admin/faculty}">
        <input type="hidden" name="id" th:value="${f.id}">
        <div class="form-grid">
            <div><label>Employee ID</label><input name="empId" th:value="${f.empId}" th:readonly="${f.id != null}" required></div>
            <div><label>Full name</label><input name="name" th:value="${f.name}" required></div>
            <div><label>Designation</label><input name="designation" th:value="${f.designation}"></div>
            <div><label>Email</label><input type="email" name="email" th:value="${f.email}"></div>
            <div><label>Phone</label><input name="phone" th:value="${f.phone}"></div>
            <div>
                <label>Department</label>
                <select name="departmentId">
                    <option value="">—</option>
                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.code} + ' · ' + ${d.name}"
                            th:selected="${f.department != null and f.department.id == d.id}"></option>
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button class="primary" type="submit">Save</button>
            <a class="btn" th:href="@{/admin/faculty}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
