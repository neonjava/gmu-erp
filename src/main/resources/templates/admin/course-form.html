<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${course.id == null ? 'Add course' : 'Edit course'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 th:text="${course.id == null ? 'Add course' : 'Edit ' + course.code}"></h1>

    <form method="post" th:action="@{/admin/courses}">
        <input type="hidden" name="id" th:value="${course.id}">
        <div class="form-grid">
            <div><label>Course code</label><input name="code" th:value="${course.code}" required></div>
            <div><label>Course name</label><input name="name" th:value="${course.name}" required></div>
            <div><label>Credits</label><input type="number" min="1" max="6" name="credits" th:value="${course.credits}"></div>
            <div><label>Semester</label><input type="number" min="1" max="8" name="semester" th:value="${course.semester}"></div>
            <div>
                <label>Department</label>
                <select name="departmentId">
                    <option value="">—</option>
                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.code}"
                            th:selected="${course.department != null and course.department.id == d.id}"></option>
                </select>
            </div>
            <div>
                <label>Faculty</label>
                <select name="facultyId">
                    <option value="">Unassigned</option>
                    <option th:each="f : ${faculty}" th:value="${f.id}" th:text="${f.empId} + ' · ' + ${f.name}"
                            th:selected="${course.faculty != null and course.faculty.id == f.id}"></option>
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button class="primary" type="submit">Save</button>
            <a class="btn" th:href="@{/admin/courses}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
