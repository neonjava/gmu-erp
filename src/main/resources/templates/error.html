<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · GMU ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container">
    <h1 th:text="${status} + ' · ' + ${error}">Error</h1>
    <p class="muted" th:if="${status == 403}">You don't have access to this page.</p>
    <p class="muted" th:if="${status == 404}">This page doesn't exist.</p>
    <p class="muted" th:if="${status == 500}">Something went wrong on our side.</p>
    <p><a class="btn" th:href="@{/}">Back to home</a></p>
</main>
</body>
</html>
