<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Attendance')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div class="page-head">
        <div>
            <h1>Attendance</h1>
            <div class="muted" th:text="'Minimum required: ' + ${required} + '%'"></div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(rows)}" class="muted">You are not registered for any course yet.</div>
    <div class="table-wrap" th:unless="${#lists.isEmpty(rows)}">
        <table>
            <tr>
                <th>Code</th><th>Course</th><th class="num">Attended</th><th class="num">Total</th>
                <th class="num">%</th><th></th><th>Status</th>
            </tr>
            <tr th:each="r : ${rows}" th:classappend="${r.shortage()} ? 'flag'">
                <td th:text="${r.course().code}"></td>
                <td th:text="${r.course().name}"></td>
                <td class="num" th:text="${r.attended()}"></td>
                <td class="num" th:text="${r.total()}"></td>
                <td class="num" th:text="${r.percent()}"></td>
                <td><span class="bar"><i th:style="'width:' + ${r.percent()} + '%'"></i></span></td>
                <td>
                    <span th:if="${r.total() == 0}" class="muted">No classes yet</span>
                    <span th:if="${r.total() > 0 and !r.shortage()}" class="tag ok">OK</span>
                    <span th:if="${r.shortage()}" class="tag danger"
                          th:text="'Shortage · attend next ' + ${r.classesNeeded()}"></span>
                </td>
            </tr>
        </table>
    </div>
</main>
</body>
</html>
