<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Course Registration')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head">
        <div>
            <h1>Course Registration</h1>
            <div class="muted" th:text="'Courses offered for ' + ${me.student.department?.code} + ', semester ' + ${me.student.semester}"></div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(offered)}" class="muted">No courses are offered for your semester yet.</div>
    <div class="table-wrap" th:unless="${#lists.isEmpty(offered)}">
        <table>
            <tr><th>Code</th><th>Course</th><th class="num">Credits</th><th>Faculty</th><th>Status</th><th></th></tr>
            <tr th:each="c : ${offered}" th:with="reg=${registered.contains(c.id)}">
                <td th:text="${c.code}"></td>
                <td th:text="${c.name}"></td>
                <td class="num" th:text="${c.credits}"></td>
                <td th:text="${c.faculty != null ? c.faculty.name : 'TBA'}"></td>
                <td><span th:if="${reg}" class="tag ok">Registered</span></td>
                <td>
                    <form th:if="${reg}" class="inline" method="post"
                          th:action="@{/student/registration/{id}/drop(id=${c.id})}"
                          th:attr="data-confirm='Drop ' + ${c.code} + '?'">
                        <button class="small" type="submit">Drop</button>
                    </form>
                    <form th:unless="${reg}" class="inline" method="post"
                          th:action="@{/student/registration/{id}/register(id=${c.id})}">
                        <button class="small primary" type="submit">Register</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</main>
</body>
</html>
