name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Start app and check pages
        run: |
          java -jar target/gmu-erp-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/login > /dev/null && break; sleep 2; done
          bash .github/smoke-test.sh
      - name: App log
        if: always()
        run: tail -n 200 app.log || true
