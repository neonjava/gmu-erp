name: Deploy preview

# Publishes the static preview (the real React screens on saved sample data) to GitHub Pages.
# It needs no server: the sample data lives in frontend/demo-data. Refresh it with `npm run capture:demo`.
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'src/main/resources/static/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the preview
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
